<script>

let clients = JSON.parse(localStorage.getItem("clients")) || [];

/* ================= ADD CLIENT ================= */
document.getElementById('add-client-btn').addEventListener('click', ()=>{

  const name = document.getElementById('client-name').value.trim();
  const phone = document.getElementById('client-phone').value.trim();
  const address = document.getElementById('client-address').value.trim();

  if(!name){
    alert("Nom obligatoire");
    return;
  }

  /* 🔥 CHECK EXISTING CLIENT (IMPORTANT POUR FACTURES) */
  let existing = clients.find(c => c.phone === phone);

  if(existing){

    alert("Client déjà existant ✔");

  } else {

    clients.push({
      id: "CL" + String(clients.length + 1).padStart(3,"0"),
      name,
      phone,
      address,
      totalInvoices: 0
    });

  }

  saveClients();
  updateTable();

  document.getElementById('client-name').value='';
  document.getElementById('client-phone').value='';
  document.getElementById('client-address').value='';
});


/* ================= SAVE ================= */
function saveClients(){
  localStorage.setItem("clients", JSON.stringify(clients));
}


/* ================= AUTO UPDATE FROM POS ================= */
/* 👉 À utiliser depuis ton saveSale() dans POS */

function updateClientFromSale(name, phone, address){

  let client = clients.find(c => c.phone === phone);

  if(client){

    client.totalInvoices += 1;

  } else {

    clients.push({
      id: "CL" + String(clients.length + 1).padStart(3,"0"),
      name,
      phone,
      address,
      totalInvoices: 1
    });

  }

  saveClients();
}


/* ================= TABLE ================= */
function updateTable(){

  const tbody = document.querySelector('#clients-table tbody');
  tbody.innerHTML='';

  if(clients.length === 0){
    tbody.innerHTML = '<tr><td colspan="5">Aucun client</td></tr>';
    return;
  }

  clients.forEach((item,i)=>{

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${item.id}</td>

      <td contenteditable="true"
        onblur="editClient(${i}, 'name', this.innerText)">
        ${item.name}
      </td>

      <td contenteditable="true"
        onblur="editClient(${i}, 'phone', this.innerText)">
        ${item.phone}
      </td>

      <td contenteditable="true"
        onblur="editClient(${i}, 'address', this.innerText)">
        ${item.address}
      </td>

      <td>${item.totalInvoices}</td>

      <td>
        <button class="remove-btn"
          onclick="deleteClient(${i})">
          X
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}


/* ================= EDIT ================= */
function editClient(index, field, value){

  clients[index][field] = value;

  saveClients();
}


/* ================= DELETE ================= */
function deleteClient(index){

  if(confirm("Supprimer ce client ?")){

    clients.splice(index,1);

    saveClients();

    updateTable();
  }
}


/* ================= INIT ================= */
window.onload = updateTable;

</script>
