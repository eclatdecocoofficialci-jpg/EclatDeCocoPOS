<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>✨ Éclat de Coco POS</h1>
</header>

<!-- NAV BAR (BOX STYLE) -->
<nav class="top-nav">
  <a href="pos.html">Dashboard</a>
  <a href="sales.html">Ventes</a>
  <a href="products.html">Produits</a>
  <a href="inventory.html">Inventory</a>
  <a href="customers.html">Clients</a>
  <a href="expenses.html">Expenses</a>
  <a href="reports.html">Reports</a>
</nav>

<!-- MAIN 3 COLUMNS -->
<div class="pos-container">

  <!-- LEFT -->
  <div class="panel left">

    <h3>Catégories</h3>
    <div id="category-boxes"></div>

  </div>

  <!-- CENTER -->
  <div class="panel center">

    <h3>🔎 Recherche produit</h3>
    <input id="search" placeholder="Nom ou barcode..." oninput="searchProduct()">

    <h3>Produits</h3>
    <div id="product-list"></div>

    <h3>Calculatrice</h3>
    <input id="display" readonly>

    <div class="calc">
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button onclick="press('+')">+</button>

      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press('-')">-</button>

      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press('*')">×</button>

      <button onclick="press(0)">0</button>
      <button onclick="clearCalc()">C</button>
      <button onclick="calculate()">=</button>
      <button onclick="press('/')">÷</button>
    </div>

  </div>

  <!-- RIGHT INVOICE -->
  <div class="panel right">

    <div class="invoice-header">
      <h2>Bienvenue à Éclat de Coco</h2>
      <p>Abidjan - Côte d’Ivoire</p>
    </div>

    <h3>Facture N°: <span id="invoice-id"></span></h3>

    <h4>Client(e)</h4>
    <input id="client-name" placeholder="Nom">
    <input id="client-phone" placeholder="Téléphone">
    <input id="client-address" placeholder="Adresse">

    <h4>Date</h4>
    <input type="date" id="date">

    <table>
      <thead>
        <tr>
          <th>Produit</th>
          <th>Qté</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="invoice-body"></tbody>
    </table>

    <h4>Livraison</h4>
    <input id="delivery" type="number" placeholder="0">

    <h2 id="grand-total">0 FCFA</h2>

    <button onclick="saveSale()">💾 Sauvegarder</button>
    <button onclick="window.print()">🖨 Imprimer</button>

    <p class="thanks">Merci d’avoir choisi Éclat de Coco 💗</p>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
