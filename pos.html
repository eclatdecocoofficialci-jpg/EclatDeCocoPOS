<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Produits - Éclat de Coco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  margin:0;
  background:#fff5fb;
}

h2{
  padding:20px;
  color:#e91e63;
}

/* LAYOUT */
.container{
  display:flex;
  gap:20px;
  padding:20px;
}

/* LEFT */
.left{
  flex:1;
  background:white;
  padding:20px;
  border-radius:15px;
}

.left input, .left select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:2px solid #f8bbd0;
}

.left button{
  width:100%;
  padding:10px;
  background:#e91e63;
  color:white;
  border:none;
  border-radius:10px;
}

/* RIGHT */
.right{
  flex:2;
  background:white;
  padding:20px;
  border-radius:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f8bbd0;
  color:#880e4f;
}

td,th{
  padding:8px;
  border:1px solid #fce4ec;
  text-align:center;
}

.remove{
  background:#ff4081;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
}

/* BACK BTN */
.back{
  margin:20px;
  padding:10px;
  background:#f8bbd0;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<button class="back" onclick="goBack()">⬅ Retour</button>

<h2>🛍 Gestion Produits</h2>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>Ajouter produit</h3>

<input id="name" placeholder="Nom produit">

<select id="category">
<option>Savon</option>
<option>Lotion</option>
<option>Body Butter</option>
<option>Masque Cheveux</option>
<option>Sérum Cheveux</option>
<option>Sérum Visage</option>
<option>Scrub</option>
</select>

<input id="price" type="number" placeholder="Prix">
<input id="stock" type="number" placeholder="Stock">

<button onclick="addProduct()">Ajouter</button>

</div>

<!-- RIGHT -->
<div class="right">

<h3>Liste produits</h3>

<table>
<thead>
<tr>
<th>Code</th>
<th>Nom</th>
<th>Catégorie</th>
<th>Prix</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

/* LOAD */
let products = JSON.parse(localStorage.getItem("products")) || [];

/* PREFIX */
const prefixMap = {
  "Savon":"SA",
  "Lotion":"LO",
  "Body Butter":"BB",
  "Masque Cheveux":"MC",
  "Sérum Cheveux":"SC",
  "Sérum Visage":"SV",
  "Scrub":"SR"
};

/* GENERATE CODE */
function generateCode(category){
  let prefix = prefixMap[category] || "PR";

  let count = products.filter(p => p.category === category).length + 1;

  return prefix + String(count).padStart(3,"0");
}

/* ADD */
function addProduct(){

  let name = document.getElementById("name").value;
  let category = document.getElementById("category").value;
  let price = Number(document.getElementById("price").value);
  let stock = Number(document.getElementById("stock").value);

  if(!name) return alert("Nom obligatoire");

  let code = generateCode(category);

  products.push({code,name,category,price,stock});

  save();
  render();
}

/* SAVE */
function save(){
  localStorage.setItem("products", JSON.stringify(products));
}

/* DELETE */
function remove(i){
  products.splice(i,1);
  save();
  render();
}

/* EDIT */
function edit(e, i, field){
  let value = e.innerText;

  if(field==="price" || field==="stock"){
    value = Number(value) || 0;
  }

  products[i][field] = value;
  save();
}

/* RENDER */
function render(){
  let table = document.getElementById("table");
  table.innerHTML="";

  if(products.length===0){
    table.innerHTML="<tr><td colspan='6'>Aucun produit</td></tr>";
    return;
  }

  products.forEach((p,i)=>{
    let tr = document.createElement("tr");

    tr.innerHTML=`
      <td>${p.code}</td>
      <td contenteditable oninput="edit(this,${i},'name')">${p.name}</td>
      <td>${p.category}</td>
      <td contenteditable oninput="edit(this,${i},'price')">${p.price}</td>
      <td contenteditable oninput="edit(this,${i},'stock')">${p.stock}</td>
      <td><button class="remove" onclick="remove(${i})">X</button></td>
    `;

    table.appendChild(tr);
  });
}

/* BACK */
function goBack(){
  window.location.href = "index.html";
}

/* INIT */
render();

</script>

</body>
</html>
