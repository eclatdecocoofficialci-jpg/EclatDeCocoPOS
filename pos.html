<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco - POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- ================= LEFT ================= -->
<div class="left">

<h3>🔎 Recherche Produit</h3>
<input type="text" id="search" placeholder="Nom ou code produit">
<div id="results"></div>

<h3>🛍 Produits</h3>
<div id="product-grid"></div>

</div>

<!-- ================= MIDDLE ================= -->
<div class="middle">

<h3>🧮 Calculatrice</h3>
<input type="text" id="display" readonly>

<div class="calc">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button>
  <button>0</button><button>C</button>
</div>

<!-- PRODUIT SELECTION -->
<div class="selected-box">

<h3 id="selected-name">-</h3>
<p>Prix: <span id="selected-price">0</span> FCFA</p>

<button onclick="minusQty()">-</button>
<span id="qty">1</span>
<button onclick="plusQty()">+</button>

<br><br>
<button onclick="addToCart()">Ajouter à la facture</button>

</div>

</div>

<!-- ================= RIGHT ================= -->
<div class="right">

<h3>🧾 Facture</h3>

<table>
<thead>
<tr>
<th>Produit</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>
<tbody id="invoice"></tbody>
</table>

<div class="discount">
<button onclick="setDiscount(0)">0%</button>
<button onclick="setDiscount(10)">10%</button>
<button onclick="setDiscount(20)">20%</button>
<button onclick="setDiscount(50)">50%</button>
</div>

<div class="total" id="total">0 FCFA</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
