<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>✨ Éclat de Coco POS</h1>
</header>

<nav class="main-nav">
  <button onclick="showSection('products')">Produits</button>
  <button onclick="showSection('sales')">Ventes</button>
  <button onclick="showSection('expenses')">Dépenses</button>
  <button onclick="showSection('customers')">Clients</button>
  <button onclick="showSection('reports')">Rapports</button>
</nav>

<div class="pos-container">

  <!-- PRODUCTS -->
  <div id="products" class="section">

    <div class="left-panel">
      <h3>📦 Catégories</h3>
      <div id="category-boxes"></div>
    </div>

    <div class="center-panel">
      <h3>🔎 Produits</h3>
      <div id="product-list"></div>

      <h3>🧮 Calculatrice</h3>
      <input id="display" readonly>

      <div class="calc">
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="press('+')">+</button>

        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press('-')">-</button>

        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press('*')">×</button>

        <button onclick="press(0)">0</button>
        <button onclick="clearCalc()">C</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('/')">÷</button>
      </div>

      <button onclick="setDiscount(20)">-20%</button>
      <button onclick="setDiscount(50)">-50%</button>
    </div>

    <!-- FACTURE -->
    <div class="right-panel">

      <h3>🧾 Facture</h3>

      <h4>N° Facture : <span id="invoice-id"></span></h4>

      <h4>Client(e)</h4>
      <input id="client-name" placeholder="Nom client(e)">
      <input id="client-phone" placeholder="Téléphone">
      <input id="client-address" placeholder="Adresse">

      <input type="date" id="date">

      <table>
        <thead>
          <tr>
            <th>Produit</th>
            <th>Qté</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="invoice-body"></tbody>
      </table>

      <input id="delivery" type="number" placeholder="Livraison">

      <h2 id="grand-total">0 FCFA</h2>

      <button onclick="window.print()">🖨 Imprimer</button>
      <button onclick="saveSale()">💾 Sauvegarder</button>

      <p style="text-align:center;">
        🙏 Merci d’avoir choisi Éclat de Coco 💗
      </p>

    </div>

  </div>

  <!-- SALES -->
  <div id="sales" class="section">
    <h2>📊 Ventes</h2>
    <iframe src="sales.html"></iframe>
  </div>

  <div id="expenses" class="section"><h2>Dépenses</h2></div>
  <div id="customers" class="section"><h2>Clients</h2></div>
  <div id="reports" class="section">
    <h2>Rapports</h2>
    <button onclick="generateReport()">Générer</button>
  </div>

</div>

<script src="script.js"></script>

<script>
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

window.onload=()=>showSection("products");
</script>

</body>
</html>
