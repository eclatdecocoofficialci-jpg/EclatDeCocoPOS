<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco - POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- ================= LEFT ================= -->
<div class="left">

<h3>🔎 Recherche Produit</h3>
<input type="text" id="search" placeholder="Nom ou code produit">
<div id="results"></div>

<h3>📦 Catégories</h3>
<div id="category-boxes"></div>

<h3>🛍 Produits</h3>
<div id="product-grid"></div>

</div>

<!-- ================= MIDDLE ================= -->
<div class="middle">

<h3>🧮 Calculatrice</h3>
<input type="text" id="display" readonly>

<div class="calc">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button>
  <button>0</button><button>C</button>
</div>

<div class="selected-box">

<h3 id="selected-name">-</h3>
<p>Prix: <span id="selected-price">0</span> FCFA</p>

<button onclick="minusQty()">-</button>
<span id="qty">1</span>
<button onclick="plusQty()">+</button>

<br><br>
<button onclick="addToCart()">Ajouter à la facture</button>

</div>

</div>

<!-- ================= RIGHT ================= -->
<div class="right">

<h3 style="text-align:center;">🧾 Facture</h3>

<h4 style="text-align:center;">
N° Facture : <span id="invoice-id"></span>
</h4>

<h2 style="text-align:center;">✨ Bienvenue à Éclat de Coco Officiel</h2>
<p style="text-align:center;">Abidjan - Côte d'Ivoire</p>

<hr>

<h4>📅 Date de facture :</h4>
<input type="date" id="invoice-date">

<hr>

<h4>Client(e)</h4>
<input type="text" id="client-name" placeholder="Nom du client">
<input type="text" id="client-phone" placeholder="Téléphone">
<input type="text" id="client-address" placeholder="Adresse">

<hr>

<table>
<thead>
<tr>
  <th>Produit</th>
  <th>Quantité</th>
  <th>Prix</th>
</tr>
</thead>
<tbody id="invoice"></tbody>
</table>

<hr>

<h4>Livraison</h4>
<input type="number" id="delivery" placeholder="Frais de livraison">

<hr>

<h2 id="total">0 FCFA</h2>

<div style="display:flex; gap:10px; margin-top:10px;">
<button id="print-btn" class="btn">🖨 Imprimer</button>
<button id="save-btn" class="btn">💾 Sauvegarder</button>
</div>

<hr>

<p style="text-align:center;">
Merci de choisir Éclat de Coco Officiel 💗
</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
