<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>✨ Éclat de Coco POS</h1>
</header>

<!-- ================= NAVIGATION (MULTI-PAGE SYSTEM) ================= -->
<nav class="main-nav">
  <a href="pos.html">Dashboard</a>
  <a href="sales.html">Ventes</a>
  <a href="products.html">Produits</a>
  <a href="inventory.html">Inventaire</a>
  <a href="expenses.html">Dépenses</a>
  <a href="reports.html">Rapports</a>
</nav>

<div class="pos-container">

  <!-- ================= PRODUCTS ================= -->
  <div id="products" class="section">

    <div class="left-panel">
      <h3>📦 Catégories</h3>
      <div id="category-boxes"></div>
    </div>

    <div class="center-panel">
      <h3>🔎 Produits</h3>
      <div id="product-list"></div>

      <h3>🧮 Calculatrice</h3>
      <input id="display" readonly>

      <div class="calc">
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="press('+')">+</button>

        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press('-')">-</button>

        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press('*')">×</button>

        <button onclick="press(0)">0</button>
        <button onclick="clearCalc()">C</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('/')">÷</button>
      </div>

      <button onclick="setDiscount(20)">-20%</button>
      <button onclick="setDiscount(50)">-50%</button>
    </div>

    <!-- ================= INVOICE ================= -->
    <div class="right-panel">

      <div style="text-align:center; margin-bottom:10px;">
        <h2 style="margin:0; font-weight:bold; color:#e91e63;">
          Bienvenue à Éclat de Coco Officiel
        </h2>

        <p style="margin:5px 0; font-weight:500;">
          Abidjan - Côte d’Ivoire
        </p>
      </div>

      <h3 style="text-align:center; color:#e91e63;">
        N° Facture : <span id="invoice-id"></span>
      </h3>

      <h4>Client(e)</h4>
      <input id="client-name" placeholder="Nom client(e)">
      <input id="client-phone" placeholder="Téléphone">
      <input id="client-address" placeholder="Adresse">

      <input type="date" id="date">

      <table>
        <thead>
          <tr>
            <th>Produit</th>
            <th>Qté</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="invoice-body"></tbody>
      </table>

      <input id="delivery" type="number" placeholder="Livraison">

      <h2 id="grand-total" style="color:#e91e63; text-align:center;">
        0 FCFA
      </h2>

      <button onclick="window.print()">🖨 Imprimer</button>
      <button onclick="saveSale()">💾 Sauvegarder</button>

      <p style="text-align:center; margin-top:10px; font-weight:500;">
        Merci d’avoir choisi Éclat de Coco 💗
      </p>

    </div>

  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

<!-- ================= SERVICE WORKER ================= -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW OK ✔"))
      .catch(err => console.log("SW ERROR ❌", err));
  });
}
</script>

</body>
</html>
