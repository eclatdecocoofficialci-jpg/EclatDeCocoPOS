<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2 data-i18n="welcome">Bienvenue à Éclat de Coco Officiel</h2>
  <p>Abidjan - Côte d’Ivoire</p>
</header>

<!-- ================= NAVIGATION ================= -->
<nav class="top-nav">

  <a href="pos.html" class="nav-box" data-i18n="dashboard">Dashboard</a>
  <a href="sales.html" class="nav-box" data-i18n="sales">Sales</a>
  <a href="products.html" class="nav-box" data-i18n="products">Products</a>
  <a href="inventory.html" class="nav-box" data-i18n="inventory">Inventory</a>
  <a href="customers.html" class="nav-box" data-i18n="customers">Customers</a>
  <a href="expenses.html" class="nav-box" data-i18n="expenses">Expenses</a>
  <a href="reports.html" class="nav-box" data-i18n="reports">Reports</a>

</nav>

<div class="pos-container">

  <!-- ================= PRODUCTS ================= -->
  <div id="products" class="section">

    <div class="left-panel">
      <h3 data-i18n="categories">Categories</h3>
      <div id="category-boxes"></div>
    </div>

    <div class="center-panel">
      <h3 data-i18n="products">Products</h3>
      <div id="product-list"></div>

      <h3 data-i18n="calculator">Calculator</h3>
      <input id="display" readonly>

      <div class="calc">
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="press('+')">+</button>

        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press('-')">-</button>

        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press('*')">×</button>

        <button onclick="press(0)">0</button>
        <button onclick="clearCalc()">C</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('/')">÷</button>
      </div>

      <button onclick="setDiscount(20)">-20%</button>
      <button onclick="setDiscount(50)">-50%</button>
    </div>

    <!-- ================= INVOICE ================= -->
    <div class="right-panel">

      <div style="text-align:center; margin-bottom:10px;">
        <h3 data-i18n="invoice" style="color:#e91e63;">Invoice</h3>

        <p data-i18n="welcome" style="font-weight:600;">
          Welcome to Éclat de Coco Official
        </p>
      </div>

      <h4>N° : <span id="invoice-id"></span></h4>

      <h4 data-i18n="client">Client</h4>
      <input id="client-name" placeholder="Name">
      <input id="client-phone" placeholder="Phone">
      <input id="client-address" placeholder="Address">

      <input type="date" id="date">

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="invoice-body"></tbody>
      </table>

      <input id="delivery" type="number" placeholder="Delivery">

      <h2 id="grand-total" style="color:#e91e63; text-align:center;">0 FCFA</h2>

      <button onclick="window.print()" data-i18n="print">Print</button>
      <button onclick="saveSale()" data-i18n="save">Save</button>

      <p data-i18n="thanks" style="text-align:center;">
        Thank you for choosing Éclat de Coco 💗
      </p>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
