<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sales</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>📊 Historique des ventes</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Date</th>
<th>Client(e)</th>
<th>Téléphone</th>
<th>Adresse</th>
<th>Total</th>
<th>Détails</th>
</tr>
</thead>

<tbody id="sales-table"></tbody>
</table>

<script>
function loadSales(){
  let sales=JSON.parse(localStorage.getItem("sales"))||[];
  let table=document.getElementById("sales-table");
  table.innerHTML="";

  sales.forEach(s=>{
    let tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${s.id}</td>
      <td>${s.date}</td>
      <td>${s.client.name}</td>
      <td>${s.client.phone}</td>
      <td>${s.client.address}</td>
      <td>${s.total}</td>
      <td><button onclick='alert(JSON.stringify(${JSON.stringify(s.cart)}))'>Voir</button></td>
    `;

    table.appendChild(tr);
  });
}

window.onload=loadSales;
</script>

</body>
</html>
