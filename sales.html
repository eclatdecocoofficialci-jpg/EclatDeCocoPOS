<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ventes | Éclat de Coco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>ventes</h2>
</header>

<main style="padding:10px;">

  <table class="sales-table">
    <thead>
      <tr>
        <th>Facture</th>
        <th>Date</th>
        <th>Client</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="sales-body"></tbody>
  </table>

</main>

<script>
function loadSales(){

  let sales = JSON.parse(localStorage.getItem("sales")) || [];
  let tbody = document.getElementById("sales-body");

  tbody.innerHTML = "";

  if(sales.length === 0){
    tbody.innerHTML = `<tr><td colspan="5">Aucune vente</td></tr>`;
    return;
  }

  sales.forEach((s, index) => {

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.id}</td>
      <td>${s.date || "-"}</td>
      <td>${s.client?.name || "-"}</td>
      <td>${s.total}</td>
      <td>
        <button onclick="viewInvoice(${index})">Voir</button>
        <button class="delete" onclick="deleteSale(${index})">Supprimer</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* VIEW */
function viewInvoice(i){
  let sales = JSON.parse(localStorage.getItem("sales")) || [];
  let s = sales[i];

  alert(
    "FACTURE: " + s.id +
    "\nCLIENT: " + (s.client?.name || "") +
    "\nTOTAL: " + s.total
  );
}

/* DELETE */
function deleteSale(i){

  if(!confirm("Supprimer cette facture ?")) return;

  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.splice(i, 1);

  localStorage.setItem("sales", JSON.stringify(sales));

  loadSales();
}

window.onload = loadSales;
</script>

</body>
</html>
