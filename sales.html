<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ventes | Éclat de Coco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Ventes</h2>
</header>

<main style="padding:10px;">

  <!-- TOTAL GLOBAL -->
  <h3>Total des ventes: <span id="total-sales">0 FCFA</span></h3>

  <table class="sales-table">
    <thead>
      <tr>
        <th>Facture</th>
        <th>Date</th>
        <th>Client</th>
        <th>Remise</th>
        <th>Paiement</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="sales-body"></tbody>
  </table>

</main>

<script>

function loadSales(){

  let sales = JSON.parse(localStorage.getItem("sales")) || [];
  let tbody = document.getElementById("sales-body");

  tbody.innerHTML = "";

  if(sales.length === 0){
    tbody.innerHTML = `<tr><td colspan="7">Aucune vente</td></tr>`;
    updateTotalSales();
    return;
  }

  /* ================= TRI PAR DATE (IMPORTANT) ================= */
  sales.sort((a, b) => new Date(b.date) - new Date(a.date));

  sales.forEach((s, index) => {

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.id || "-"}</td>
      <td>${s.date || "-"}</td>
      <td>${s.client?.name || "-"}</td>
      <td>${s.discount || "0%"}</td>
      <td>${s.paymentMethod || "-"}</td>
      <td>${Math.round(parseFloat(s.total) || 0)} FCFA</td>
      <td>
        <button onclick="viewInvoice(${index})">Voir</button>
        <button onclick="deleteSale(${index})">Supprimer</button>
      </td>
    `;

    tbody.appendChild(tr);
  });

  updateTotalSales();
}

/* ================= VIEW INVOICE ================= */
function viewInvoice(i){

  let sales = JSON.parse(localStorage.getItem("sales")) || [];
  sales.sort((a, b) => new Date(b.date) - new Date(a.date));

  let s = sales[i];

  let items = s.cart?.map(p =>
    `${p.name} x${p.qty} = ${p.price * p.qty} FCFA`
  ).join("\n") || "";

  alert(
    "FACTURE: " + (s.id || "-") +
    "\nDATE: " + (s.date || "-") +
    "\nCLIENT: " + (s.client?.name || "-") +
    "\n\nPRODUITS:\n" + items +
    "\n\nREMISE: " + (s.discount || "0%") +
    "\nLIVRAISON: " + (s.delivery || 0) + " FCFA" +
    "\nPAIEMENT: " + (s.paymentMethod || "-") +
    "\nTOTAL: " + Math.round(parseFloat(s.total) || 0) + " FCFA"
  );
}

/* ================= DELETE ================= */
function deleteSale(i){

  if(!confirm("Supprimer cette vente ?")) return;

  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.sort((a, b) => new Date(b.date) - new Date(a.date));
  sales.splice(i, 1);

  localStorage.setItem("sales", JSON.stringify(sales));

  loadSales();
}

/* ================= TOTAL GLOBAL ================= */
function updateTotalSales(){

  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  let total = sales.reduce((sum, s) => {
    return sum + (parseFloat(s.total) || 0);
  }, 0);

  document.getElementById("total-sales").innerText =
    Math.round(total) + " FCFA";
}

window.onload = loadSales;

</script>

</body>
</html>
