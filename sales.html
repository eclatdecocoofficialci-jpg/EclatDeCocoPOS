<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ventes | Éclat de Coco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Ventes</h2>
</header>

<main style="padding:10px;">

  <!-- TOTAL GLOBAL -->
  <h3>
    Total des ventes:
    <span id="total-sales">0 FCFA</span>
  </h3>

  <table class="sales-table">
    <thead>
      <tr>
        <th>Facture</th>
        <th>Date</th>
        <th>Client</th>
        <th>Remise</th>
        <th>Paiement</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="sales-body"></tbody>
  </table>

</main>

<script>
function getSales(){
  return JSON.parse(localStorage.getItem("sales")) || [];
}

/* ================= LOAD SALES ================= */
function loadSales(){

  let sales = getSales();
  let tbody = document.getElementById("sales-body");
  tbody.innerHTML = "";

  if(sales.length === 0){
    tbody.innerHTML = `
      <tr>
        <td colspan="7">Aucune vente enregistrée</td>
      </tr>
    `;
    updateTotalSales();
    return;
  }

  // tri du plus récent
  sales.sort((a, b) => new Date(b.date) - new Date(a.date));

  sales.forEach((s, index) => {

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.id || "-"}</td>
      <td>${new Date(s.date).toLocaleString()}</td>

      <!-- CLIENT -->
      <td>
        ${s.client?.name || "-"} <br>
        <small>${s.client?.phone || ""}</small>
      </td>

      <!-- REMISE (si tu utilises plus tard) -->
      <td>${s.discount || 0}%</td>

      <!-- PAIEMENT (FIX IMPORTANT) -->
      <td>${s.payment || s.paymentMethod || "-"}</td>

      <!-- TOTAL -->
      <td style="color:#e91e63;font-weight:bold;">
        ${Math.round(s.total || 0)} FCFA
      </td>

      <!-- ACTION -->
      <td>
        <button onclick="viewInvoice(${index})">👁 Voir</button>
        <button onclick="deleteSale(${index})">🗑 Supprimer</button>
      </td>
    `;

    tbody.appendChild(tr);
  });

  updateTotalSales();
}

/* ================= VIEW INVOICE ================= */
function viewInvoice(i){

  let sales = getSales();
  sales.sort((a, b) => new Date(b.date) - new Date(a.date));

  let s = sales[i];

  if(!s){
    alert("Facture introuvable");
    return;
  }

  let items = (s.items || []).map(p =>
    `${p.name} x${p.qty} = ${p.price * p.qty} FCFA`
  ).join("\n");

  alert(
    "FACTURE #" + s.id +
    "\nDATE: " + new Date(s.date).toLocaleString() +
    "\n\nCLIENT: " + (s.client?.name || "-") +
    "\nTEL: " + (s.client?.phone || "-") +
    "\n\nPRODUITS:\n" + items +
    "\n\nLIVRAISON: " + (s.delivery || 0) + " FCFA" +
    "\nPAIEMENT: " + (s.payment || s.paymentMethod || "-") +
    "\nTOTAL: " + Math.round(s.total || 0) + " FCFA"
  );
}

/* ================= DELETE ================= */
function deleteSale(i){

  if(!confirm("Supprimer cette vente ?")) return;

  let sales = getSales();
  sales.sort((a, b) => new Date(b.date) - new Date(a.date));

  sales.splice(i, 1);

  localStorage.setItem("sales", JSON.stringify(sales));

  loadSales();
}

/* ================= TOTAL GLOBAL ================= */
function updateTotalSales(){

  let sales = getSales();

  let total = sales.reduce((sum, s) => {
    return sum + Number(s.total || 0);
  }, 0);

  document.getElementById("total-sales").innerText =
    Math.round(total) + " FCFA";
}

/* ================= INIT ================= */
window.onload = loadSales;
</script>
<div class="main-content">

  <!-- tout ton contenu ici -->
  
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <p>© 2025 Éclat de Coco Official</p>
    <p class="sub">All rights reserved • Natural beauty inspired by Côte d’Ivoire 🌿🥥</p>
  </div>
</footer>
</body>
</html>
