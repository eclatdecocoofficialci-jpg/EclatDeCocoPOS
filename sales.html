<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ventes | Éclat de Coco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css?v=72">

<style>
.sales-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.sales-table th,
.sales-table td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

.sales-table th {
  background: #f8c8d8;
}

.action-btn {
  padding: 4px 6px;
  font-size: 12px;
  margin: 2px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

.view { background: #4caf50; color: white; }
.edit { background: #2196f3; color: white; }
.delete { background: #e91e63; color: white; }

.action-cell {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 3px;
}
</style>
</head>

<body>

<header>
  <h2>Ventes</h2>
</header>

<main style="padding:10px;">

  <h3>
    Total des ventes :
    <span id="total-sales">0 FCFA</span>
  </h3>

  <table class="sales-table">
    <thead>
      <tr>
        <th>Facture</th>
        <th>Date</th>
        <th>Client</th>
        <th>Paiement</th>
        <th>Sous-total</th>
        <th>Livraison</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="sales-body"></tbody>
  </table>

</main>

<script>
function getSales(){
  return JSON.parse(localStorage.getItem("sales")) || [];
}

function loadSales(){

  let sales = getSales();
  let tbody = document.getElementById("sales-body");

  tbody.innerHTML = "";

  if(sales.length === 0){
    tbody.innerHTML = `
      <tr>
        <td colspan="8">Aucune vente enregistrée</td>
      </tr>
    `;
    updateTotalSales();
    return;
  }

  let sorted = [...sales].sort((a,b)=>
    (b.date || "").localeCompare(a.date || "")
  );

  sorted.forEach((s) => {

    let subtotal = s.subtotal || (s.total - (s.delivery || 0));

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.id || "-"}</td>

      <td>${s.date || "-"}</td>

      <td>
        ${s.client?.name || "-"}<br>
        <small>${s.client?.phone || ""}</small>
      </td>

      <td>${s.payment || "-"}</td>

      <td>${Math.round(subtotal)} FCFA</td>

      <td>${s.delivery || 0} FCFA</td>

      <td style="color:#e91e63;font-weight:bold;">
        ${Math.round(s.total || 0)} FCFA
      </td>

      <td class="action-cell">
        <button class="action-btn view" onclick="viewInvoice(${s.id})">👁</button>
        <button class="action-btn edit" onclick="editSale(${s.id})">✏️</button>
        <button class="action-btn delete" onclick="deleteSale(${s.id})">🗑</button>
      </td>
    `;

    tbody.appendChild(tr);
  });

  updateTotalSales();
}

function viewInvoice(id){

  let sales = getSales();
  let s = sales.find(x => String(x.id) === String(id));

  if(!s){
    alert("Facture introuvable");
    return;
  }

  let items = (s.items || []).map(p =>
    `${p.name} x${p.qty} = ${p.price * p.qty} FCFA`
  ).join("\n");

  alert(
    "FACTURE #" + s.id +
    "\nDATE: " + (s.date || "-") +
    "\nCLIENT: " + (s.client?.name || "-") +
    "\nTEL: " + (s.client?.phone || "-") +

    "\n\nPRODUITS:\n" + items +

    "\n\nSOUS-TOTAL: " + Math.round((s.subtotal || (s.total - (s.delivery || 0)))) + " FCFA" +
    "\nLIVRAISON: " + (s.delivery || 0) + " FCFA" +
    "\nTOTAL: " + Math.round(s.total || 0) + " FCFA" +

    "\n\nPAIEMENT: " + (s.payment || "-")
  );
}

function editSale(id){

  let sales = getSales();
  let s = sales.find(x => String(x.id) === String(id));

  if(!s){
    alert("Facture introuvable");
    return;
  }

  localStorage.setItem("edit_sale", JSON.stringify(s));
  window.location.href = "./pos.html";
}

function deleteSale(id){

  if(!confirm("Supprimer cette vente ?")) return;

  let sales = getSales();
  sales = sales.filter(x => String(x.id) !== String(id));

  localStorage.setItem("sales", JSON.stringify(sales));

  loadSales();
}

function updateTotalSales(){

  let sales = getSales();

  let total = sales.reduce((sum,s)=>
    sum + Number(s.total || 0), 0
  );

  document.getElementById("total-sales").innerText =
    Math.round(total) + " FCFA";
}

window.onload = loadSales;
</script>

<footer style="text-align:center;margin-top:20px;">
  <p>© 2025 Éclat de Coco Official</p>
</footer>

</body>
</html>
