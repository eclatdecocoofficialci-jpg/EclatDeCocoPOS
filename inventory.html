<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éclat de Coco - Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; margin:0; background:#fdf0f6; }
    h2,h3{ margin:0 0 10px 0; color:#e91e63; }

    .container { display:flex; gap:20px; padding:20px; flex-wrap:wrap; }

    .left-panel {
      flex:1; background:#fff; padding:20px; border-radius:16px; max-width:400px;
    }

    .left-panel input, .left-panel select, .left-panel button {
      width:100%; padding:10px; margin-bottom:10px;
      border-radius:10px; border:2px solid #f8bbd0;
    }

    .left-panel button {
      background:#e91e63; color:#fff; border:none; cursor:pointer;
    }

    .right-panel {
      flex:2; background:#fff; padding:20px; border-radius:16px;
    }

    table { width:100%; border-collapse:collapse; }

    th,td {
      border:1px solid #f8bbd0;
      padding:8px;
      text-align:center;
    }

    th { background:#ffe6ef; color:#e91e63; }

    .low-stock { background:#ffcccc; }

    button {
      background:#ff4081; color:#fff; border:none; padding:5px 10px; border-radius:6px;
    }
  </style>
</head>

<body>

<h2 style="padding:20px;">Gestion Matières Premières</h2>

<div class="container">

  <!-- LEFT -->
  <div class="left-panel">
    <h3>Ajouter une matière</h3>

    <input type="text" id="name" placeholder="Nom (ex: Beurre de karité)">

    <input type="number" id="quantity" placeholder="Quantité">

    <select id="unit">
      <option value="kg">kg</option>
      <option value="g">g</option>
      <option value="ml">ml</option>
      <option value="L">L</option>
      <option value="pcs">pcs</option>
    </select>

    <input type="number" id="cost" placeholder="Coût par unité">

    <button id="add-btn">Ajouter</button>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <h3>Stock des matières</h3>

    <table id="inventory-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Quantité</th>
          <th>Unité</th>
          <th>Coût</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr><td colspan="5">Aucune donnée</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>

// LOAD
let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

// SAVE
function saveInventory(){
  localStorage.setItem("inventory", JSON.stringify(inventory));
}

// DISPLAY
function updateTable(){
  const tbody = document.querySelector("#inventory-table tbody");
  tbody.innerHTML = "";

  if(inventory.length === 0){
    tbody.innerHTML = "<tr><td colspan='5'>Aucune donnée</td></tr>";
    return;
  }

  inventory.forEach((item,i)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td contenteditable="true" data-field="name" data-index="${i}">${item.name}</td>
      <td contenteditable="true" class="${item.quantity<5?'low-stock':''}" data-field="quantity" data-index="${i}">${item.quantity}</td>
      <td>${item.unit}</td>
      <td contenteditable="true" data-field="cost" data-index="${i}">${item.cost}</td>
      <td><button data-index="${i}">X</button></td>
    `;

    tbody.appendChild(tr);
  });
}

// ADD
document.getElementById("add-btn").addEventListener("click", ()=>{
  const name = document.getElementById("name").value.trim();
  const quantity = parseFloat(document.getElementById("quantity").value) || 0;
  const unit = document.getElementById("unit").value;
  const cost = parseFloat(document.getElementById("cost").value) || 0;

  if(!name){
    alert("Nom obligatoire");
    return;
  }

  inventory.push({name, quantity, unit, cost});

  saveInventory();
  updateTable();

  document.getElementById("name").value="";
  document.getElementById("quantity").value="";
  document.getElementById("cost").value="";
});

// DELETE
document.querySelector("#inventory-table tbody").addEventListener("click", e=>{
  if(e.target.tagName === "BUTTON"){
    const index = e.target.dataset.index;

    inventory.splice(index,1);

    saveInventory();
    updateTable();
  }
});

// EDIT
document.querySelector("#inventory-table tbody").addEventListener("input", e=>{
  const field = e.target.dataset.field;
  const index = e.target.dataset.index;

  if(field){
    inventory[index][field] = field === "quantity" || field === "cost"
      ? Number(e.target.innerText) || 0
      : e.target.innerText;

    saveInventory();
  }
});

// INIT
window.addEventListener("DOMContentLoaded", updateTable);

</script>
<footer class="site-footer">
  <div class="footer-inner">
    <p>© 2025 Éclat de Coco Official</p>
    <p class="sub">All rights reserved • Natural beauty inspired by Côte d’Ivoire 🌿🥥</p>
  </div>
</footer>
</body>
</html>
