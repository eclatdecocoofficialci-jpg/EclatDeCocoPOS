<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco - Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  margin:0;
  background:#fdf0f6;
}

h2,h3{
  margin:0 0 10px 0;
  color:#e91e63;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

/* LEFT */
.left-panel{
  flex:1;
  background:#fff;
  padding:20px;
  border-radius:16px;
  min-width:280px;
}

input,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:2px solid #f8bbd0;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#e91e63;
  color:#fff;
  cursor:pointer;
}

/* RIGHT */
.right-panel{
  flex:2;
  background:#fff;
  padding:20px;
  border-radius:16px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #f8bbd0;
  padding:8px;
  text-align:center;
}

th{
  background:#ffe6ef;
  color:#e91e63;
}

.remove-btn{
  background:#ff4081;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2 style="padding:20px;">Gestion Produits</h2>

<div class="container">

<!-- LEFT -->
<div class="left-panel">

<h3>Ajouter un produit</h3>

<input type="text" id="name" placeholder="Nom du produit">

<select id="category">
  <option value="Savon">Savon</option>
  <option value="Lotions">Lotions</option>
  <option value="Body Butter">Body Butter</option>
  <option value="Masque Cheveux">Masque Cheveux</option>
  <option value="Sérum Cheveux">Sérum Cheveux</option>
  <option value="Sérum Visage">Sérum Visage</option>
  <option value="Scrub">Scrub</option>
  <option value="Crème Hydratante">Crème Hydratante</option>
  <option value="Souvenir">Souvenir</option>
</select>

<input type="number" id="price" placeholder="Prix">
<input type="number" id="stock" placeholder="Stock">

<button id="add">Ajouter Produit</button>

</div>

<!-- RIGHT -->
<div class="right-panel">

<h3>Liste Produits</h3>

<table>
<thead>
<tr>
<th>Code</th>
<th>Nom</th>
<th>Catégorie</th>
<th>Prix</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

/* LOAD */
let products = JSON.parse(localStorage.getItem("products")) || [];
let categoryCount = JSON.parse(localStorage.getItem("categoryCount")) || {};

/* SAVE */
function save(){
  localStorage.setItem("products", JSON.stringify(products));
  localStorage.setItem("categoryCount", JSON.stringify(categoryCount));
}

/* CODE GENERATION */
function generateCode(cat){
  let prefix = cat.substring(0,2).toUpperCase();

  if(!categoryCount[prefix]){
    categoryCount[prefix] = 1;
  } else {
    categoryCount[prefix]++;
  }

  return prefix + String(categoryCount[prefix]).padStart(3,"0");
}

/* DISPLAY */
function render(){
  let tbody = document.getElementById("table");
  tbody.innerHTML = "";

  if(products.length === 0){
    tbody.innerHTML = `<tr><td colspan="6">Aucun produit</td></tr>`;
    return;
  }

  products.forEach((p,i)=>{
    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${p.code}</td>
      <td contenteditable="true" data-i="${i}" data-f="name">${p.name}</td>
      <td>${p.category}</td>
      <td contenteditable="true" data-i="${i}" data-f="price">${p.price}</td>
      <td contenteditable="true" data-i="${i}" data-f="stock">${p.stock}</td>
      <td><button class="remove" data-i="${i}">X</button></td>
    `;

    tbody.appendChild(tr);
  });
}

/* ADD */
document.getElementById("add").addEventListener("click",()=>{
  let name = document.getElementById("name").value.trim();
  let category = document.getElementById("category").value;
  let price = Number(document.getElementById("price").value) || 0;
  let stock = Number(document.getElementById("stock").value) || 0;

  if(!name){
    alert("Nom obligatoire");
    return;
  }

  let code = generateCode(category);

  products.push({
    code,
    name,
    category,
    price,
    stock
  });

  save();
  render();

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("stock").value="";
});

/* DELETE */
document.getElementById("table").addEventListener("click",(e)=>{
  if(e.target.classList.contains("remove")){
    let i = e.target.dataset.i;
    products.splice(i,1);
    save();
    render();
  }
});

/* EDIT */
document.getElementById("table").addEventListener("input",(e)=>{
  let i = e.target.dataset.i;
  let f = e.target.dataset.f;

  if(f){
    products[i][f] = (f==="price" || f==="stock")
      ? Number(e.target.innerText) || 0
      : e.target.innerText;

    save();
  }
});

/* INIT */
window.onload = render;

</script>
<footer class="site-footer">
  <div class="footer-inner">
    <p>© 2025 Éclat de Coco Official</p>
    <p class="sub">All rights reserved • Natural beauty inspired by Côte d’Ivoire 🌿🥥</p>
  </div>
</footer>
</body>
</html>
