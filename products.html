<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco - POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  margin:0;
  background:#fdf0f6;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

/* LEFT */
.left{
  flex:1;
  background:white;
  padding:15px;
  border-radius:16px;
  min-width:280px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:2px solid #f8bbd0;
  border-radius:10px;
}

/* SEARCH RESULTS */
.result{
  background:#ffe6ef;
  padding:10px;
  margin-bottom:5px;
  border-radius:10px;
  cursor:pointer;
}

/* RIGHT */
.right{
  flex:2;
  background:white;
  padding:15px;
  border-radius:16px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #f8bbd0;
  padding:8px;
  text-align:center;
}

th{
  background:#ffe6ef;
  color:#e91e63;
}

/* BUTTONS */
.btn{
  background:#e91e63;
  color:white;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* CALCULATOR */
.calc{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
}

.calc button{
  padding:15px;
  border:none;
  border-radius:8px;
  background:#f8bbd0;
  font-size:16px;
}

/* DISCOUNT */
.discount{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.discount button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#ff80ab;
  color:white;
}

.total{
  font-size:18px;
  margin-top:10px;
  font-weight:bold;
  color:#e91e63;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>🔎 Recherche Produit</h3>
<input type="text" id="search" placeholder="Nom ou code produit">

<div id="results"></div>

<h3>🧮 Calculatrice</h3>
<input type="text" id="display" readonly>

<div class="calc">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button>
  <button>0</button><button>.</button><button>C</button>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<h3>🧾 Facture</h3>

<table>
<thead>
<tr>
<th>Produit</th>
<th>Prix</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>
<tbody id="invoice"></tbody>
</table>

<div class="discount">
<button onclick="setDiscount(0)">0%</button>
<button onclick="setDiscount(10)">10%</button>
<button onclick="setDiscount(20)">20%</button>
<button onclick="setDiscount(50)">50%</button>
</div>

<div class="total" id="total">Total: 0</div>

</div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];
let invoice = [];
let discount = 0;

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
  let val = this.value.toLowerCase();
  let res = document.getElementById("results");
  res.innerHTML = "";

  let found = products.filter(p =>
    p.name.toLowerCase().includes(val) ||
    p.code.toLowerCase().includes(val)
  );

  found.forEach(p=>{
    let div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `${p.code} - ${p.name} (${p.price})`;

    div.onclick = ()=>{
      addToInvoice(p);
    };

    res.appendChild(div);
  });
});

/* ADD TO INVOICE */
function addToInvoice(p){
  invoice.push({
    name:p.name,
    price:p.price,
    qty:1
  });

  renderInvoice();
}

/* RENDER */
function renderInvoice(){
  let tbody = document.getElementById("invoice");
  tbody.innerHTML = "";

  let total = 0;

  invoice.forEach(item=>{
    let t = item.price * item.qty;
    total += t;

    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>${item.price}</td>
      <td>${item.qty}</td>
      <td>${t}</td>
    `;
    tbody.appendChild(tr);
  });

  let final = total - (total * discount / 100);

  document.getElementById("total").innerText =
    "Total: " + final.toFixed(2);
}

/* DISCOUNT */
function setDiscount(p){
  discount = p;
  renderInvoice();
}

/* CALCULATOR FIX */
let display = document.getElementById("display");

document.querySelectorAll(".calc button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    let val = btn.innerText;

    if(val === "C"){
      display.value = "";
    } else {
      display.value += val;
    }
  });
});

</script>

</body>
</html>
