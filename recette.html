<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Éclat de Coco Official</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- HEADER -->
<header>
  <h1>Recette - Éclat de Coco</h1>
</header>

<!-- NAV -->
<nav class="top-nav">
  <a href="./pos.html">POS</a>
  <a href="./recette.html">Recette</a>
</nav>

<div class="main-content">
<div class="pos-container">

<!-- ================= LEFT ================= -->
<div class="panel left">

  <h3>📦 Nom de la recette</h3>

  <!-- TITLE INPUT -->
  <input id="recipe-name"
    placeholder="Ex: Savon Coco Luxe"
    oninput="updateRecipeTitle()"
    style="
      font-weight:bold;
      text-align:center;
      border:2px solid #f8bbd0;
      border-radius:10px;
      padding:10px;
    "
  >

  <!-- DISPLAY TITLE -->
  <div class="pink-box" style="margin-top:10px;">
    🧼 <span id="recipe-title" style="font-weight:bold;">Nouvelle recette</span>
  </div>

  <hr style="margin:15px 0; border:1px solid #ffd6e5;">

  <h3>➕ Ajouter ingrédient</h3>

  <input id="ing_name" placeholder="Nom ingrédient">

  <select id="ing_unit">
    <option value="kg">kg</option>
    <option value="g">g</option>
    <option value="L">L</option>
    <option value="ml">ml</option>
    <option value="%">%</option>
  </select>

  <input id="ing_qty" type="number" placeholder="Quantité">

  <input id="ing_price" type="number" placeholder="Prix total">

  <div class="pink-box" onclick="addIngredient()">
    ➕ Ajouter au tableau
  </div>

</div>

<!-- ================= CENTER ================= -->
<div class="panel center">

  <h3>Recette en cours</h3>

  <table>
    <thead>
      <tr>
        <th>Ingrédient</th>
        <th>Qté</th>
        <th>Unité</th>
        <th>Prix</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="recipe-body"></tbody>
  </table>

</div>

<!-- ================= RIGHT ================= -->
<div class="panel right">

  <h3>Résumé recette</h3>

  <div class="pink-box">
    Total recette :
    <h2 id="recipe-total">0 FCFA</h2>
  </div>

  <div class="pink-box">
    Poids total :
    <span id="recipe-weight">0</span>
  </div>

  <button onclick="saveRecipe()">
    💾 Sauvegarder recette
  </button>

</div>

</div>
</div>

<script src="./recette.js"></script>

<!-- ================= TITLE SCRIPT ================= -->
<script>
function updateRecipeTitle(){
  const name = document.getElementById("recipe-name").value;
  document.getElementById("recipe-title").innerText =
    name || "Nouvelle recette";
}
</script>

</body>
</html>
