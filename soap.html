<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soap Studio - Éclat de Coco</title>

<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./soap.css">
    
</head>

<body>

<header>
  <h1> Soap Studio - Production</h1>
</header>

<nav class="top-nav">

  <a href="./dashboard.html">Dashboard</a>
  <a href="./pos.html">POS</a>
  <a href="./recette.html">Recette</a>
  <a href="./soap.html">Soap Studio</a>
  <a href="./products.html">Produits</a>
  <a href="./inventory.html">Inventory</a>
  <a href="./customers.html">Clients</a>
  <a href="./expenses.html">Dépenses</a>
  <a href="./reports.html">Rapports</a>
  <a href="./sales.html">ventes</a>
  <a href="./suppliers.html">fournisseurs</a>

</nav>

<div class="main-content">

  <div class="soap-container">

    <!-- LEFT -->
    <div class="soap-left">

      <h3>🧼 Production Savon</h3>

      <input id="soap_name" placeholder="Nom du savon">

      <input id="c_oil" type="number" placeholder="Huile (L)" oninput="calcCustomSoap()">

      <input id="c_soap" type="number" placeholder="Base savon (kg)" oninput="calcCustomSoap()">

      <input id="c_perfume" type="number" placeholder="Parfum (ml)" oninput="calcCustomSoap()">

      <input id="c_mold" type="number" placeholder="Moule" oninput="calcCustomSoap()">

      <input id="c_labor" type="number" placeholder="Main d'œuvre" oninput="calcCustomSoap()">

      <input id="c_pack" type="number" placeholder="Packaging" oninput="calcCustomSoap()">

      <div class="pink-box">
        💰 Total :
        <h2 id="custom-total">0</h2>
      </div>

      <button onclick="addCustomSoap()">
        ➕ Ajouter
      </button>

    </div>

    <!-- RIGHT -->
    <div class="soap-right">

      <h3>📋 Production en cours</h3>

      <table>

        <thead>
          <tr>
            <th>Nom</th>
            <th>Qté</th>
            <th>Prix</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="soap-body"></tbody>

      </table>


</div>

<script src="./soap.js"></script>

</body>
</html>
