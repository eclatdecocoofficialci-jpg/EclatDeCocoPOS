<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background: linear-gradient(90deg,#fff5fb,#ffe6ef,#fff5fb);
  color:#333;
}

/* HEADER */
header{
  background:#f06292;
  color:white;
  padding:15px;
  text-align:center;
}

/* MENU GRID */
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 4px 10px rgba(233,30,99,0.1);
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  background:#ffe6ef;
  transform:scale(1.03);
}

/* BUTTON TEXT */
a{
  text-decoration:none;
  color:#e91e63;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <h1>✨ Éclat de Coco Officiel</h1>
  <p>Gestion Business - POS System</p>
</header>

<div class="menu">

  <div class="card">
    <a href="pos.html">🧾 Open POS</a>
  </div>

  <div class="card">
    <a href="dashboard.html">📊 Dashboard</a>
  </div>

  <div class="card">
    <a href="sales.html">💰 Sales</a>
  </div>

  <div class="card">
    <a href="products.html">🛍 Products</a>
  </div>

  <div class="card">
    <a href="inventory.html">📦 Inventory</a>
  </div>

  <div class="card">
    <a href="customers.html">👤 Customers</a>
  </div>

</div>

</body>
</html>
