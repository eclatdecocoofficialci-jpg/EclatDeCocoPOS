<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e91e63">

<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= FULLSCREEN FIX ================= */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ================= GLOBAL ================= */
body{
  font-family: Poppins, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* ================= BACKGROUND ================= */
body::before{
  content:"";
  position:absolute;
  inset:0;

  background:url("./coco-bg.jpg") center/cover no-repeat;

  filter:brightness(0.55);
  z-index:-3;

  animation:bgMove 18s ease-in-out infinite alternate;
}

@keyframes bgMove{
  0%{ transform:scale(1) translateX(0); }
  100%{ transform:scale(1.08) translateX(-20px); }
}

/* ================= OVERLAY ================= */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    135deg,
    rgba(233,30,99,0.30),
    rgba(46,125,50,0.25)
  );
  z-index:-2;
}

/* ================= TITLE ================= */
.title{
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:600;
  text-shadow:0 5px 15px rgba(0,0,0,0.4);
  padding:0 20px;
}

/* ================= PETALS ================= */
.petal{
  position:absolute;
  width:10px;
  height:10px;
  background:rgba(255,192,203,0.8);
  border-radius:50%;
  animation:fall linear infinite;
  z-index:-1;
}

@keyframes fall{
  0%{
    transform:translateY(-10vh);
    opacity:1;
  }
  100%{
    transform:translateY(110vh) translateX(40px);
    opacity:0;
  }
}

/* ================= LOGIN CARD ================= */
.card{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  padding:30px;
  border-radius:20px;
  width:320px;

  text-align:center;

  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 10px 30px rgba(0,0,0,0.3);

  color:white;
  z-index:2;

  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= INPUT ================= */
input{
  width:100%;
  padding:12px;
  margin-top:15px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:16px;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#e91e63;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* ================= SMALL TEXT ================= */
.small{
  font-size:12px;
  margin-top:10px;
  opacity:0.9;
}

</style>
</head>

<body>

<!-- TITLE -->
<div class="title">
  Bienvenue dans l’univers Éclat de Coco
</div>

<!-- LOGIN CARD -->
<div class="card">

  <h2>Éclat de Coco POS</h2>

  <input type="password" id="code" placeholder="Enter code">

  <button onclick="enterApp()">Enter</button>

  <div class="small">
    Nature • Coco • Beauté 🌿
  </div>

</div>

<script>

/* ================= LOGIN ================= */
function enterApp(){

  const code = document.getElementById("code").value;

  console.log("entered code:", code);

  if(code === "29121509"){

    localStorage.setItem("eclat_logged", "true");

    window.location.href = "pos.html";

  } else {

    alert("Wrong code ❌");
  }
}

/* ================= PETALS ================= */
window.onload = function(){
  createPetals();
};

function createPetals(){
  for(let i=0;i<18;i++){

    let p = document.createElement("div");
    p.className = "petal";

    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (4 + Math.random()*5) + "s";
    p.style.opacity = Math.random();

    document.body.appendChild(p);
  }
}

</script>

</body>
</html>
