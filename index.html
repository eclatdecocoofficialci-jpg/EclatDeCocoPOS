<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éclat de Coco Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA SUPPORT -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e91e63">

<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{
  margin:0;
  font-family:Poppins;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff0f5;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

input{
  width:100%;
  padding:12px;
  margin-top:15px;
  border-radius:10px;
  border:2px solid #f8bbd0;
  outline:none;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#e91e63;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>Éclat de Coco POS</h2>

  <input type="password" id="code" placeholder="Enter code">

  <button onclick="enterApp()">Enter</button>
</div>

<script>
function enterApp(){
  const code = document.getElementById("code").value;

  if(code === "29121509"){
    // IMPORTANT FIX (GitHub Pages + iPad safe)
    window.location.href = "./pos.html?v=1";
  } else {
    alert("Wrong code ❌");
  }
}
</script>

</body>
</html>
