<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Éclat de Coco Login</title>

<link rel="manifest" href="./manifest.json?v=61">
<meta name="theme-color" content="#e91e63">

<link rel="apple-touch-icon" href="./icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Éclat POS">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= RESET FULLSCREEN ================= */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Poppins, sans-serif;
}

/* ================= BACKGROUND ================= */
body {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* ================= BACKGROUND IMAGE ================= */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("./coco-bg.jpg") center/cover no-repeat;
  filter: brightness(0.55);
  z-index: -3;
  animation: bgMove 18s ease-in-out infinite alternate;
}

@keyframes bgMove {
  0% { transform: scale(1) translateX(0); }
  100% { transform: scale(1.08) translateX(-20px); }
}

/* ================= OVERLAY ================= */
body::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(233,30,99,0.30),
    rgba(46,125,50,0.25)
  );
  z-index: -2;
}

/* ================= TITLE ================= */
.title {
  position: absolute;
  top: 40px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 20px;
  font-weight: 600;
  text-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* ================= LOGIN CARD ================= */
.card {

  background: rgba(255,255,255,0.12);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  padding: 30px;

  border-radius: 20px;

  width: 320px;

  text-align: center;

  border: 1px solid rgba(255,255,255,0.25);

  box-shadow: 0 10px 30px rgba(0,0,0,0.3);

  color: white;
}

/* ================= INPUT ================= */
input {

  width: 100%;

  padding: 12px;

  margin-top: 15px;

  border-radius: 10px;

  border: none;

  outline: none;

  font-size: 16px;

  box-sizing: border-box;
}

/* ================= BUTTON ================= */
button {

  width: 100%;

  margin-top: 15px;

  padding: 12px;

  border: none;

  border-radius: 10px;

  background: #e91e63;

  color: white;

  font-weight: bold;

  cursor: pointer;
}

/* ================= SMALL TEXT ================= */
.small {
  font-size: 12px;
  margin-top: 10px;
  opacity: 0.9;
}

/* ================= FOOTER ================= */
.site-footer {

  position: absolute;

  bottom: 12px;

  width: 100%;

  text-align: center;

  color: white;

  font-size: 11px;

  opacity: 0.8;

  z-index: 2;
}

</style>
</head>

<body>

<div class="title">
  Bienvenue dans l’univers Éclat de Coco
</div>

<div class="card">

  <h2>Éclat de Coco POS</h2>

  <input
    type="password"
    id="code"
    placeholder="Enter code"
  >

  <button onclick="enterApp()">
    Enter
  </button>

  <div class="small">
    Nature • Coco • Beauté 🌿
  </div>

</div>

<footer class="site-footer">
  © 2025 Éclat de Coco Official • All rights reserved
</footer>

<script>

/* ================= LOGIN ================= */
function enterApp(){

  const code =
    document.getElementById("code").value;

  if(code === "29121509"){

    localStorage.setItem(
      "eclat_logged",
      "true"
    );

    window.location.href = "./pos.html";

  } else {

    alert("Code incorrect ❌");
  }
}

/* ================= ENTER KEY ================= */
document
  .getElementById("code")
  .addEventListener("keypress", function(e){

    if(e.key === "Enter"){
      enterApp();
    }

});

/* ================= SERVICE WORKER ================= */
if("serviceWorker" in navigator){

  window.addEventListener("load", async () => {

    try{

      const reg =
        await navigator.serviceWorker.register(
          "./service-worker.js?v=61"
        );

      await reg.update();

      // FORCE NEW VERSION
      if(reg.waiting){

        reg.waiting.postMessage({
          type: "SKIP_WAITING"
        });

      }

      let refreshing = false;

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {

          if(refreshing) return;

          refreshing = true;

          window.location.reload();
        }
      );

    } catch(err){

      console.log("SW error:", err);
    }

  });

}

</script>

</body>
</html>
