<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éclat de Coco - Commandes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Journal des Commandes</h2>

<div class="container">

  <!-- Côté gauche : filtres ou résumé -->
  <div class="left-panel">
    <h3>Filtres</h3>
    <input type="date" id="filter-date">
    <button id="filter-btn">Filtrer</button>
  </div>

  <!-- Côté droit : tableau commandes -->
  <div class="right-panel">
    <h3>Liste des Commandes</h3>
    <table id="orders-table">
      <thead>
        <tr>
          <th>ID Facture</th>
          <th>Client</th>
          <th>Date</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5">Aucune commande</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Détails facture modal -->
<div id="details-modal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); background:#fff; border:2px solid #f8bbd0; padding:20px; z-index:1000;">
  <h3>Détails de la facture</h3>
  <table id="details-table">
    <thead>
      <tr><th>Produit</th><th>Qté</th><th>Prix</th><th>Total</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <button onclick="closeModal()">Fermer</button>
</div>

<script>
function loadOrders(){
  const orders = JSON.parse(localStorage.getItem("sales")) || [];
  const tbody = document.querySelector('#orders-table tbody');
  tbody.innerHTML = '';
  if(orders.length===0){
    tbody.innerHTML = '<tr><td colspan="5">Aucune commande</td></tr>';
    return;
  }
  orders.forEach((o,i)=>{
    const tr = document.createElement('tr');
    const total = o.total || o.cart.reduce((acc,p)=>acc+p.price*p.qty,0) + (o.delivery||0);
    tr.innerHTML = `
      <td>${o.id}</td>
      <td>${o.client}</td>
      <td>${o.date}</td>
      <td>${total.toLocaleString()} FCFA</td>
      <td><button onclick="showDetails(${i})">Détails</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function showDetails(index){
  const orders = JSON.parse(localStorage.getItem("sales")) || [];
  const order = orders[index];
  const tbody = document.querySelector('#details-table tbody');
  tbody.innerHTML = '';
  order.cart.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.name}</td><td>${p.qty}</td><td>${p.price.toLocaleString()}</td><td>${(p.price*p.qty).toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('details-modal').style.display='block';
}

function closeModal(){
  document.getElementById('details-modal').style.display='none';
}

document.getElementById('filter-btn').addEventListener('click',()=>{
  const date = document.getElementById('filter-date').value;
  const orders = JSON.parse(localStorage.getItem("sales")) || [];
  const tbody = document.querySelector('#orders-table tbody');
  tbody.innerHTML='';
  const filtered = orders.filter(o=>o.date===date);
  if(filtered.length===0){
    tbody.innerHTML = '<tr><td colspan="5">Aucune commande</td></tr>';
    return;
  }
  filtered.forEach((o,i)=>{
    const total = o.total || o.cart.reduce((acc,p)=>acc+p.price*p.qty,0) + (o.delivery||0);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${o.id}</td><td>${o.client}</td><td>${o.date}</td><td>${total.toLocaleString()} FCFA</td><td><button onclick="showDetails(${i})">Détails</button></td>`;
    tbody.appendChild(tr);
  });
});

loadOrders();
</script>
<footer class="site-footer">
  <div class="footer-inner">
    <p>© 2025 Éclat de Coco Official</p>
    <p class="sub">All rights reserved • Natural beauty inspired by Côte d’Ivoire 🌿🥥</p>
  </div>
</footer>
</footer>
</body>
</html>
